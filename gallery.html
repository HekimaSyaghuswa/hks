<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie - HK</title>
<style>
body{background:#f4f6fb;font-family:Arial;margin:0;padding:20px}
h2{text-align:center;color:#0b4f8a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;max-width:900px;margin:auto}
.card{background:white;border-radius:15px;overflow:hidden;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:200px;object-fit:cover;border-radius:12px}
.badge{display:inline-block;background:#0b4f8a;color:white;font-size:12px;padding:5px 12px;border-radius:20px;font-weight:bold;margin:10px 0 5px}
.titre{font-size:19px;font-weight:bold;text-transform:uppercase;margin:5px 0;color:#111}
.desc{color:#444;margin:5px 0}
.info{color:#555;font-size:14px;margin:3px 0}
.prix{display:inline-block;background:#fff3d6;color:#b77900;font-weight:bold;padding:6px 12px;border-radius:20px;margin-top:8px}
a{display:block;text-align:center;margin-top:20px;color:#0b4f8a;font-weight:bold}
</style>
</head>
<body>
<h2>🖼️ Galerie HK - Tout le monde voit tout</h2>
<div class="grid" id="galerie"></div>
<p id="vide" style="text-align:center">Chargement...</p>
<a href="upload.html">➕ Publier</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjAXZJDJyHCN5ed5fJQY1DzRA_Kq3h5Rs",
  authDomain: "tphk-gallery.firebaseapp.com",
  databaseURL: "https://tphk-gallery-default-rtdb.firebaseio.com",
  projectId: "tphk-gallery",
  storageBucket: "tphk-gallery.firebasestorage.app",
  messagingSenderId: "212082158055",
  appId: "1:212082158055:web:fccaadb4785f511071b542"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, 'produits'), (snap) => {
  const div = document.getElementById('galerie');
  div.innerHTML = '';
  const data = snap.val();
  if(!data){ document.getElementById('vide').textContent = "Aucune photo pour l'instant"; return; }
  document.getElementById('vide').style.display = 'none';
  Object.values(data).reverse().forEach(p => {
    const titre = p.titre || p.title || p.produit || p.nomProduit || p.name || p.nom || "Sans titre";
    let photo = p.photo || p.image || p.imageUrl || p.img || p.photoURL || p.url || "";
    if(!photo){
      for(let v of Object.values(p)){
        if(typeof v === 'string' && v.startsWith('http') && (v.includes('cloudinary') || v.includes('.jpg') || v.includes('.png') || v.includes('firebasestorage'))){ photo = v; break; }
      }
    }
    const nom = p.nom || p.auteur || p.vendeur || "HK";
    const prix = p.prix || p.price || "";
    const desc = p.desc || p.description || "";
    const lieu = p.lieu || p.ville || "";
    const tel = p.telephone || p.tel || p.phone || "";
    const dateStr = p.date ? new Date(p.date).toLocaleDateString() : "";

    // ICI : si lieu ou tel n'existent pas, on n'affiche RIEN, donc plus de undefined
    const lieuHTML = lieu ? `<div class="info">📍 ${lieu}</div>` : ``;
    const telHTML = tel ? `<div class="info">📱 ${tel}</div>` : ``;
    const dateHTML = dateStr ? `<div class="info">📅 ${dateStr}</div>` : ``;

    div.innerHTML += `
    <div class="card">
      <img src="${photo}">
      <span class="badge">👤 Vendeur HK</span>
      <div class="titre">${titre}</div>
      <div class="info">Vendeur : <b>${nom}</b></div>
      <div class="desc">${desc}</div>
      ${lieuHTML}
      ${telHTML}
      ${dateHTML}
      ${prix ? `<div class="prix">${prix}</div>` : ``}
    </div>`;
  });
});
</script>
</body>
</html>
