<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie - HK</title>
<style>body{background:#f4f6fb;font-family:Arial;margin:0;padding:20px}h2{text-align:center;color:#0b4f8a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:900px;margin:auto}.card{background:white;border-radius:12px;overflow:hidden}.card img{width:100%;height:180px;object-fit:cover}.card div{padding:10px}a{display:block;text-align:center;margin-top:20px;color:#0b4f8a;font-weight:bold}</style>
</head>
<body>
<h2>🖼️ Galerie HK - Tout le monde voit tout</h2>
<div class="grid" id="galerie"></div>
<p id="vide" style="text-align:center">Chargement...</p>
<a href="upload.html">➕ Publier</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjAXZJDJyHCN5ed5fJQY1DzRA_Kq3h5Rs",
  authDomain: "tphk-gallery.firebaseapp.com",
  databaseURL: "https://tphk-gallery-default-rtdb.firebaseio.com",
  projectId: "tphk-gallery",
  storageBucket: "tphk-gallery.firebasestorage.app",
  messagingSenderId: "212082158055",
  appId: "1:212082158055:web:fccaadb4785f511071b542"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, 'produits'), (snap) => {
  const div = document.getElementById('galerie');
  div.innerHTML = '';
  const data = snap.val();
  if(!data){ document.getElementById('vide').textContent = "Aucune photo pour l'instant"; return; }
  document.getElementById('vide').style.display = 'none';
  Object.values(data).reverse().forEach(p => {
    // 1. PHOTO : on cherche dans TOUS les noms possibles, même ceux qu'on ne connait pas
    let photo = p.photo || p.image || p.imageUrl || p.img || p.photoURL || p.url || p.lien || p.link || "";
    if(!photo){
      // Si toujours pas trouvé, on cherche n'importe quelle valeur qui ressemble à un lien http
      for(let v of Object.values(p)){
        if(typeof v === 'string' && v.startsWith('http') && (v.includes('cloudinary') || v.includes('.jpg') || v.includes('.png') || v.includes('.webp') || v.includes('firebasestorage'))){
          photo = v; break;
        }
      }
    }
    // 2. TITRE : si c'est un NOUVEAU (titre existe), on prend titre. Si c'est un ANCIEN (pas de titre), on prend nom comme titre
    const isNouveau = !!(p.titre || p.title || p.produit || p.nomProduit);
    const titre = p.titre || p.title || p.produit || p.nomProduit || p.name || p.nom || "Sans titre";
    // 3. VENDEUR : si nouveau, vendeur = nom. Si ancien, on ne connait pas le vendeur, on met "HK"
    const nom = isNouveau ? (p.nom || p.auteur || p.vendeur || "Inconnu") : "HK";
    const prix = p.prix || p.price || "";
    const desc = p.desc || p.description || "";
    div.innerHTML += `<div class="card"><img src="${photo}" onerror="this.src='https://via.placeholder.com/300?text=Photo'"><div><b>${titre}</b><br><small>Par ${nom} - ${prix}</small><br><small>${desc}</small></div></div>`;
  });
});
</script>
</body>
</html>
