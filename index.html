<style>
/* CORRECTION PHOTO ENTIÈRE */
.papeterie-card img{width:100%;height:auto !important;max-height:380px;object-fit:contain !important;background:#fff;display:block}
.vendeur-badge{background:#0b4f8a;color:white;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:bold;display:inline-block;margin-bottom:8px}
.btn-supprimer{background:#ff3b30;color:white;border:0;padding:8px 15px;border-radius:20px;font-weight:bold;cursor:pointer;margin-left:10px}
</style>

<script>
const BASE = "https://tphk-gallery-default-rtdb.firebaseio.com";
// POUR VOIR LE BOUTON SUPPRIMER : ouvre ton site avec ?admin=hk123 à la fin
// Ex: ton-site.com/index.html?admin=hk123
const EST_ADMIN = new URLSearchParams(window.location.search).get('admin') === 'hk123';

async function afficherProduits(){
  let zone=document.getElementById('liste-produits');
  if(!zone) return;
  zone.innerHTML='<p style="text-align:center">Chargement...</p>';
  let res=await fetch(BASE+"/produits.json");
  let data=await res.json();
  if(!data){zone.innerHTML='<p style="text-align:center">Aucun produit.</p>';return;}
  let entrees=Object.entries(data).reverse();
  zone.innerHTML=entrees.map(([id,p])=>`
    <div class="papeterie-card">
      <img src="${p.img}">
      <div>
        <span class="vendeur-badge">👤 ${p.vendeur || 'Vendeur HK'}</span>
        <h4>${p.nom}</h4>
        <p>${p.desc||''}</p>
        <p>📍 ${p.adresse}<br>📱 ${p.tel}<br>📅 ${p.date||''}</p>
        <span class="prix">${p.prix} FC</span><br><br>
        <a href="https://wa.me/243${p.tel.replace(/[^0-9]/g,'').slice(-9)}" style="display:inline-block;background:#25D366;color:white;padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:bold">Commander</a>
        ${EST_ADMIN ? `<button class="btn-supprimer" onclick="supprimerProduit('${id}')">🗑 Supprimer</button>` : ''}
      </div>
    </div>`).join('');
}
async function supprimerProduit(id){
  if(!confirm("Supprimer ce produit ?")) return;
  await fetch(BASE+"/produits/"+id+".json",{method:"DELETE"});
  alert("Supprimé !");
  afficherProduits();
}
afficherProduits();
</script>
