<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier - HK</title>
<style>*{box-sizing:border-box;font-family:Arial}body{background:#f4f6fb;margin:0;padding:20px}.box{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}h2{color:#0b4f8a;text-align:center}input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px}button{width:100%;background:#25D366;color:white;border:0;padding:15px;border-radius:10px;font-weight:bold;font-size:17px}button:disabled{opacity:.6}a{display:block;text-align:center;margin-top:15px;color:#0b4f8a;font-weight:bold}img{width:100%;border-radius:10px;margin-top:10px;display:none}</style>
</head>
<body>
<div class="box">
<h2>➕ Publie ton produit</h2>
<input id="nom" placeholder="Ton nom ex: KAKULE">
<input id="titre" placeholder="Nom du produit ex: tableau">
<input id="prix" placeholder="Prix ex: 10$">
<textarea id="desc" placeholder="Description ex: Solide et lisse"></textarea>
<input id="lieu" placeholder="Lieu ex: Goma, Butembo">
<input id="tel" placeholder="Téléphone ex: +243...">
<label style="font-weight:bold">📸 Choisis ta photo :</label>
<input type="file" id="photo" accept="image/*">
<img id="apercu">
<button id="btn" onclick="publier()">Publier</button>
<p id="msg" style="text-align:center;color:green;font-weight:bold"></p>
<a href="gallery.html">🖼️ Voir Galerie</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjAXZJDJyHCN5ed5fJQY1DzRA_Kq3h5Rs",
  authDomain: "tphk-gallery.firebaseapp.com",
  databaseURL: "https://tphk-gallery-default-rtdb.firebaseio.com",
  projectId: "tphk-gallery",
  storageBucket: "tphk-gallery.firebasestorage.app",
  messagingSenderId: "212082158055",
  appId: "1:212082158055:web:fccaadb4785f511071b542"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const CLOUD_NAME = "sogn1cr8";
const UPLOAD_PRESET = "hekima_presset";

document.getElementById('photo').addEventListener('change', e => {
  const f = e.target.files[0];
  if(f){ const img = document.getElementById('apercu'); img.src = URL.createObjectURL(f); img.style.display='block'; }
});

window.publier = async function(){
  const nom = document.getElementById('nom').value.trim();
  const titre = document.getElementById('titre').value.trim();
  const prix = document.getElementById('prix').value.trim();
  const desc = document.getElementById('desc').value.trim();
  const lieu = document.getElementById('lieu').value.trim();
  const telephone = document.getElementById('tel').value.trim();
  const file = document.getElementById('photo').files[0];
  const btn = document.getElementById('btn');
  if(!nom || !titre || !file){ alert("Remplis nom, titre et photo"); return; }
  btn.disabled = true; btn.textContent = "Envoi en cours...";

  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  fd.append('folder', 'hekima');
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {method:'POST', body: fd});
  const data = await res.json();
  if(!data.secure_url){ alert("Erreur Cloudinary: "+JSON.stringify(data)); btn.disabled=false; btn.textContent="Publier"; return; }

  await push(ref(db, 'produits'), {
    nom, titre, prix, desc, lieu, telephone,
    photo: data.secure_url,
    date: Date.now()
  });

  alert("Publié pour tout le monde ! 🌍");
  window.location.href = "gallery.html";
}
</script>
</body>
</html>
