<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEKIMA SYAGHUSWA - HK Papeterie</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f4f6fb}
header{background:#0b4f8a;color:white;padding:18px 15px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}
.btn-modifier{background:#FF9800;color:white;border:0;padding:10px 15px;border-radius:20px;font-weight:bold;cursor:pointer;margin-left:5px;margin-top:10px}
.compteur{text-align:center;background:#0b4f8a;color:white;padding:10px 20px;border-radius:20px;max-width:300px;margin:0 auto 20px;font-weight:bold}
.top{padding:15px;text-align:right}
.compte{background:#0b4f8a;color:white;border:0;padding:12px 20px;border-radius:20px;font-weight:bold}
input[type=text]{padding:8px;border:1px solid #ccc;border-radius:6px;margin:10px}
.grid{padding:10px;max-width:900px;margin:auto}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:15px}
.card img{width:100%;max-height:300px;object-fit:cover;border-radius:10px;background:#eee;display:block}
.badge{background:#0b4f8a;color:white;border:0;padding:7px 14px;border-radius:20px;font-weight:bold;cursor:pointer;margin:10px 0}
.titre{color:#0b4f8a;font-weight:bold;font-size:18px;text-transform:uppercase}
.desc{color:#333;margin:8px 0}
.info{color:#333;margin:4px 0}
.prix{display:inline-block;background:#fff3d6;color:#b77900;font-weight:bold;padding:6px 12px;border-radius:20px;margin-top:8px}
.btns{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.btns button,.btns a{border:0;padding:10px 14px;border-radius:20px;font-weight:bold;cursor:pointer;text-decoration:none;font-size:14px}
.cmd{background:#25D366;color:white}
.prixBtn{background:#ff9f00;color:white}
.descBtn{background:#fff;border:1px solid #999}
.del{background:#ff3b30;color:white}
.btn-desc{background:#9C27B0;color:white;border:0;padding:10px 15px;border-radius:20px;font-weight:bold;cursor:pointer;margin-left:5px;margin-top:10px}
.recherche{max-width:500px;margin:0 auto 20px}
.recherche input{width:100%;padding:13px;border:1px solid #ddd;border-radius:20px;font-size:16px;outline:none}
</style>
</head>
<body>
<header><b>HEKIMA SYAGHUSWA</b><span>HK Papeterie</span></header>
<div class="top"><button class="compte">📦 <span id="nb">0</span> produit(s) publié(s)</button></div>
<input type="text" id="recherche" placeholder="🔍 Rechercher un produit" oninput="filtrer()">
<div class="compteur" id="compteur-index">Chargement...</div>
<div class="recherche">
  <input id="search-index" placeholder="🔍 Rechercher un produit, un vendeur, une ville..." oninput="filtrerIndex()">
</div>

<div id="liste-produits"></div>
<div class="grid" id="galerie"></div>
<p style="text-align:center"><a href="gallery.html">Voir toute la galerie</a> | <a href="upload.html">➕ Publier</a></p>

<script>
const BASE = "https://tphk-gallery-default-rtdb.firebaseio.com";
const MOT_DE_PASSE = "hk123";
let tousProduitsIndex = [];

async function afficherProduits(){
  let zone=document.getElementById('liste-produits');
  if(!zone) return;
  zone.innerHTML='<p style="text-align:center">Chargement...</p>';
  try{
    let res=await fetch(BASE+"/produits.json");
    let data=await res.json();
    tousProduitsIndex = data ? Object.entries(data).reverse() : [];
    let cpt = document.getElementById('compteur-index');
    if(cpt) cpt.innerText = "📦 " + tousProduitsIndex.length + " produit(s) publié(s)";
    afficherIndex(tousProduitsIndex);
  }catch(e){zone.innerHTML='<p style="text-align:center">Pas de connexion. Réessaie.</p>';}
}

function afficherIndex(entrees){
  let zone=document.getElementById('liste-produits');
  if(entrees.length==0){zone.innerHTML='<p style="text-align:center;background:white;padding:25px;border-radius:15px">Aucun produit trouvé.</p>';return;}
  zone.innerHTML=entrees.map(([id,p])=>`
    <div class="papeterie-card">
      <img src="${p.img}">
      <div>
        <span class="vendeur-badge">👤 ${p.vendeur || 'Vendeur HK'}</span>
        <h4>${p.nom}</h4><p>${p.desc||''}</p><p>📍 ${p.adresse}<br>📱 ${p.tel}<br>📅 ${p.date||''}</p><span class="prix">${p.prix}</span><br><br>
        <a href="https://wa.me/243${String(p.tel).replace(/[^0-9]/g,'').slice(-9)}" style="display:inline-block;background:#25D366;color:white;padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:bold">Commander</a>
        <button class="btn-modifier" onclick="modifierPrix('${id}','${p.prix}')">✏️ Prix</button>
        <button class="btn-desc" onclick="modifierDesc('${id}')">✏️ Desc</button>
        <button class="btn-supprimer" onclick="supprimerProduit('${id}')">🗑 Supprimer</button>
      </div>
    </div>`).join('');
}

function filtrerIndex(){
  let mot = document.getElementById('search-index').value.toLowerCase().trim();
  if(!mot){ afficherIndex(tousProduitsIndex); return; }
  let filtres = tousProduitsIndex.filter(([id,p])=>{
    return (p.nom||'').toLowerCase().includes(mot) ||
           (p.vendeur||'').toLowerCase().includes(mot) ||
           (p.desc||'').toLowerCase().includes(mot) ||
           (p.adresse||'').toLowerCase().includes(mot);
  });
  afficherIndex(filtres);
}

async function supprimerProduit(id){
  let mdp = prompt("🔒 Mot de passe Admin pour supprimer :");
  if(mdp === null) return;
  if(mdp !== MOT_DE_PASSE){ alert("Mot de passe incorrect !"); return; }
  if(!confirm("Supprimer ce produit ?")) return;
  await fetch(BASE+"/produits/"+id+".json",{method:"DELETE"});
  alert("Produit supprimé !");
  afficherProduits();
}
async function modifierPrix(id, ancienPrix){
  let mdp = prompt("🔒 Mot de passe Admin pour modifier le prix :");
  if(mdp === null) return;
  if(mdp !== MOT_DE_PASSE){ alert("Mot de passe incorrect !"); return; }
  let nouveauPrix = prompt("Nouveau prix (ex: 20000 FC ou 12 $) :", ancienPrix);
  if(nouveauPrix === null || nouveauPrix.trim() === "") return;
  await fetch(BASE+"/produits/"+id+".json",{method:"PATCH", body: JSON.stringify({prix: nouveauPrix.trim()})});
  alert("Prix modifié !");
  afficherProduits();
}
async function modifierDesc(id){
  let mdp = prompt("🔒 Mot de passe Admin pour modifier la description :");
  if(mdp === null) return;
  if(mdp !== MOT_DE_PASSE){ alert("Mot de passe incorrect !"); return; }
  let nouvelleDesc = prompt("Nouvelle description :");
  if(nouvelleDesc === null) return;
  await fetch(BASE+"/produits/"+id+".json",{method:"PATCH", body: JSON.stringify({desc: nouvelleDesc.trim()})});
  alert("Description modifiée !");
  afficherProduits();
}
afficherProduits();
</script>
</body>
</html>
