<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie TPHK</title>
<style>
  body { font-family: Arial; background: #111; color: white; text-align: center; margin: 0; padding: 15px; }
  h1 { font-size: 22px; }
  #gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  #gallery img { width: 100%; border-radius: 12px; }
  #loading { margin-top: 30px; }
  a { color: #25D366; display: block; margin-top: 20px; }
</style>
</head>
<body>

<h1>📸 Galerie TPHK</h1>
<div id="loading">Chargement des photos...</div>
<div id="gallery"></div>
<a href="upload.html">➕ Envoyer une photo</a>

<script>
const gallery = document.getElementById('gallery');
const loading = document.getElementById('loading');

fetch('https://tphk-gallery-default-rtdb.firebaseio.com/photos.json')
  .then(r => r.json())
  .then(data => {
    loading.style.display = 'none';
    if (!data) {
      loading.style.display = 'block';
      loading.textContent = "Aucune photo pour le moment. Envoie la première !";
      return;
    }
    let photos = Object.values(data).map(p => p.url);
    photos.reverse().forEach(url => {
      const img = document.createElement('img');
      img.src = url;
      gallery.appendChild(img);
    });
  })
  .catch(e => {
    loading.textContent = "Erreur de chargement : " + e;
  });
</script>

</body>
</html>
