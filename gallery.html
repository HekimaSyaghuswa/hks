<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie TPHK</title>
<style>
  body { font-family: Arial; background: #111; color: white; text-align: center; margin: 0; padding: 15px; }
  .card { background: #222; border-radius: 12px; padding: 10px; margin-bottom: 15px; text-align: left; }
  .card img { width: 100%; border-radius: 10px; }
  .card b { display: block; margin-top: 8px; }
  .card p { margin: 5px 0; color: #ccc; font-size: 14px; }
  .del { background: #ff4444; color: white; border: none; padding: 8px 12px; border-radius: 8px; margin-top: 5px; }
  a { color: #25D366; display: block; margin-top: 20px; }
</style>
</head>
<body>

<h1>📸 Galerie TPHK</h1>
<div id="loading">Chargement...</div>
<div id="gallery"></div>
<a href="upload.html">➕ Envoyer une photo</a>

<script>
const gallery = document.getElementById('gallery');
const loading = document.getElementById('loading');

function load() {
  gallery.innerHTML = "";
  fetch('https://tphk-gallery-default-rtdb.firebaseio.com/photos.json')
    .then(r => r.json())
    .then(data => {
      loading.style.display = 'none';
      if (!data) { loading.style.display='block'; loading.textContent="Aucune photo pour le moment."; return; }
      let entries = Object.entries(data).reverse();
      entries.forEach(([key, p]) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <img src="${p.url}">
          <b>👤 ${p.name || 'Anonyme'}</b>
          <p>${p.desc || ''}</p>
          <button class="del" onclick="supprimer('${key}')">🗑️ Supprimer</button>
        `;
        gallery.appendChild(div);
      });
    });
}

function supprimer(key) {
  if (!confirm("Tu veux vraiment supprimer cette photo ?")) return;
  fetch(`https://tphk-gallery-default-rtdb.firebaseio.com/photos/${key}.json`, { method: 'DELETE' })
    .then(() => load());
}

load();
</script>
</body>
</html>
